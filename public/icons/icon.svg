<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(250, 80%, 60%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(250, 60%, 40%);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)"/>
  
  <!-- Checkmark -->
  <path d="M 35 64 L 52 81 L 93 40" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- List lines -->
  <line x1="35" y1="50" x2="55" y2="50" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="35" y1="95" x2="75" y2="95" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
